name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify confirm fixture gates correctly
        run: |
          python preflight_checker.py tests/fixtures/danger --format json --fail-on confirm && exit 1 || test $? -eq 2
      - name: Generate self preflight report
        run: python preflight_checker.py . --format markdown --output self-preflight.md
