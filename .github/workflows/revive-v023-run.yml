name: Run v0.2.3 revival patch

on:
  push:
    branches: ["revive/v0.2.3"]
    paths:
      - "tools/revive_v023.py"
      - "tools/fix_revival_test.py"
      - ".github/workflows/revive-v023-run.yml"

permissions:
  contents: write

jobs:
  revive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: revive/v0.2.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Apply deterministic revival patch
        run: python tools/revive_v023.py
      - name: Adjust generated HTTP regression harness
        run: python tools/fix_revival_test.py
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run full test suite before committing
        run: python -m pytest -q
      - name: Commit revival changes
        run: |
          git config user.name "Agent Assist Revival"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git commit -m "fix: revive v0.2.3 safety and persistence"
          git push origin HEAD:revive/v0.2.3
