name: Fix Python 3.9 revival compatibility

on:
  push:
    branches: ["revive/v0.2.3"]
    paths: [".github/workflows/fix-py39-revival.yml"]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: revive/v0.2.3
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Replace datetime.UTC with Python 3.9 compatible timezone.utc
        run: |
          python - <<'PY'
          from pathlib import Path
          paths = [
              Path("management_webui/server.py"),
              Path("dist/フォルダの中身チェック/management_webui/server.py"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if text.count("_dt.UTC") != 1:
                  raise SystemExit(f"unexpected _dt.UTC count in {path}: {text.count('_dt.UTC')}")
              path.write_text(text.replace("_dt.UTC", "_dt.timezone.utc", 1), encoding="utf-8")
          PY
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run Python 3.9 tests
        run: python -m pytest -q
      - name: Commit compatibility fix
        run: |
          git config user.name "Agent Assist Revival"
          git config user.email "actions@users.noreply.github.com"
          git add management_webui/server.py "dist/フォルダの中身チェック/management_webui/server.py"
          git commit -m "fix: support HTTP paths on Python 3.9"
          git push origin HEAD:revive/v0.2.3
